<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Memory Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .landing {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px
    }

    .landing .big-shapes {
      display: flex;
      gap: 26px;
      margin-bottom: 34px;
      align-items: flex-end
    }

    .landing .big-shapes i {
      display: block;
      width: 78px;
      height: 78px;
      border: 8px solid var(--pink);
      animation: pulse 2.4s ease-in-out infinite
    }

    .landing .big-shapes i:nth-child(1) {
      border-radius: 50%
    }

    .landing .big-shapes i:nth-child(2) {
      width: 0;
      height: 0;
      border: none;
      border-left: 44px solid transparent;
      border-right: 44px solid transparent;
      border-bottom: 76px solid var(--teal);
      animation-delay: .3s
    }

    .landing .big-shapes i:nth-child(3) {
      border-radius: 8px;
      animation-delay: .6s
    }

    @keyframes pulse {
      50% {
        transform: translateY(-10px)
      }
    }

    .landing h1 {
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(3.4rem, 14vw, 9rem);
      letter-spacing: .06em;
      line-height: .95;
      text-transform: uppercase
    }

    .landing h1 em {
      font-style: normal;
      color: var(--pink)
    }

    .landing .sub {
      color: var(--muted);
      letter-spacing: .14em;
      margin: 18px 0 38px
    }

    .start {
      --c: var(--pink);
      font-family: var(--display);
      font-size: 1.8rem;
      letter-spacing: .14em;
      padding: 14px 46px;
      border-radius: 999px;
      background: var(--pink);
      color: #fff;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 0 0 rgba(237, 27, 118, .6);
      animation: ring 2s infinite;
      display: inline-block
    }

    .start:hover {
      background: #ff2d89
    }

    @keyframes ring {
      70% {
        box-shadow: 0 0 0 22px rgba(237, 27, 118, 0)
      }

      100% {
        box-shadow: 0 0 0 0 rgba(237, 27, 118, 0)
      }
    }

    .landing .hint {
      margin-top: 26px;
      color: var(--muted);
      font-size: .8rem;
      letter-spacing: .12em
    }
  </style>
  <script>try { var m = JSON.parse(sessionStorage.getItem('morph') || 'null'); if (m) { document.documentElement.classList.add('arriving'); document.documentElement.style.setProperty('--arrive', m.color) } } catch (e) { }</script>
</head>

<body>
  <div class="bg-shapes" aria-hidden="true">
    <span class="c" style="width:90px;height:90px;left:6%;top:12%"></span>
    <span class="t" style="left:82%;top:18%;animation-delay:-4s"></span>
    <span style="width:80px;height:80px;left:12%;top:72%;animation-delay:-8s"></span>
    <span class="c" style="width:60px;height:60px;left:88%;top:70%;animation-delay:-2s"></span>
    <span class="t" style="left:48%;top:86%;animation-delay:-6s"></span>
  </div>

  <main class="landing">
    <div class="big-shapes" aria-hidden="true"><i></i><i></i><i></i></div>
    <span class="badge">PLAYER 001 · JASMINE MALLANAO MAGAUAY</span>
    <h1>My Memory<br><em>Games</em></h1>
    <p class="sub">EIGHT ROUNDS · ONE LIFE · ARE YOU READY?</p>
    <a class="start" href="menu.html" data-morph data-shape="circle" data-color="#ed1b76">START THE GAME</a>
    <p class="hint">A PERSONAL MEMORY PROJECT · NO ONE GETS ELIMINATED HERE</p>
  </main>
  <script src="main.js"></script>
</body>

</html>
